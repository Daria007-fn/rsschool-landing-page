<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="icon" href="./assets/icons/favicon.png" type="image/png">
    <script src="./script.js" defer></script>
    <title>Coffee shop</title>
</head>
<body>
    <header class="header container">
        <a class="header-logo" href="index.html">
            <img class="header-logo-image" src="./assets/logo/logo.svg" alt="Coffee shop" width='100' height='60' >
        </a>
        <nav class="header-menu">
            <ul class="header-menu-list">
                <li class="header-menu-item">
                    <a class="header-menu-link" href="#Favorite-coffee">Favorite coffee</a>
                </li>
                <li class="header-menu-item">
                    <a class="header-menu-link" href="#About">About</a>
                </li>
                <li class="header-menu-item">
                    <a class="header-menu-link" href="#Mobile-app">Mobile app</a>
                </li>
                <li class="header-menu-item">
                    <a class="header-menu-link" href="#Contact-us">Contact us</a>
                </li>
            </ul>
        </nav>
        <div class="header-actions">
            <button class="theme-toggle" id="themeToggle">
                <span class="theme-toggle-track">
                    <span class="theme-toggle-thumb"></span>
                    <img class="theme-toggle-icon sun-icon" src="./assets/icons/Sun.svg" alt="Light theme">
                    <img class="theme-toggle-icon moon-icon" src="./assets/icons/Moon.svg" alt="Dark theme">
                </span>
            </button>
            <a class="header-menu-link-cup" href="/">
            Menu <img src="./assets/icons/coffeecup.svg" class="cup-of-coffee" alt=""> 
            </a>
        </div>
    </header>
    <main>
        <section class="catalog-navigation container">
            <h1 class="catalog-title">ведутся работы... буду благодарна если дадите мне времечко доделать...Behind each of our cups hides an amazing surprise</h1>
            <div catalog-navigation-link>
                <button class="catalog-button" type="button" aria-selected="true">
                    <span class=""> 
                        <img class="catalog-coffee-icon" href="/assets/icons/free-icon-coffee-5497803.png" alt="icon-coffee">
                    </span>
                </button>
                <button class="catalog-button" type="button" aria-selected="false">
                    <span class=""> 
                        <img class="catalog-tea" href="/assets/icons/free-icon-teapot-3877724.png" alt="icon-teapot">
                    </span>
                </button>
                <button class="catalog-button" type="button" aria-selected="false">
                    <span class=""> 
                        <img class="" href="/assets/icons/free-icon-cake-slice-2445557.png" alt="icon-cake">
                    </span>
                </button>
            </div>
        </section>
    </main>
    <footer>
        <section class="contact container" id="Contact-us">
            <div class="contact-content">
                <div class="contact-social">
                    <h2 class="contact-title">Sip, Savor, Smile.<span class="contact-title-accent">It’s coffee time!</span></h2>
                    <div class="contact-links">
                        <a class="contact-link" href="/">
                            <img src="./assets/icons/twitter.svg" alt="Twitter" class="contact-link-icon">
                        </a>
                        <a class="contact-link" href="/">
                            <img src="./assets/icons/instagram.svg" alt="Instagram" class="contact-link-icon">
                        </a>
                        <a class="contact-link" href="/">
                            <img src="./assets/icons/facebook.svg" alt="Facebook" class="contact-link-icon">
                        </a>
                    </div>
                </div>
                <div class="contact-information">
                    <h3 class="contact-information-title"> Contact us </h3>
                    <div class="contact-information-item">
                        <img src="./assets/icons/pin-alt.svg" alt="Address" class="contact-information-icon">
                        <p class="contact-information-description">8558 Green Rd., LA </p>
                    </div>
                    <div class="contact-information-item">
                        <img src="./assets/icons/phone.svg" alt="Number" class="contact-information-icon">
                        <p class="contact-information-description"> +1 (603) 555-0123 </p>
                    </div>
                    <div class="contact-information-item">
                        <img src="./assets/icons/clock.svg" alt="Working hours" class="contact-information-icon">
                        <p class="contact-information-description"> Mon–Sat: 9:00–23:00</p>
                    </div>
                </div>
            </div>
        </section>
    </footer>
</body>
</html>
