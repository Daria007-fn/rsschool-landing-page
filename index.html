<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
    <title>Coffee shop</title>
</head>
<body>
    <header class="header container">
        <a class="header-logo" href="/">
            <img class="header-logo-image" src="./assets/logo/logo.svg" alt="Coffee shop" loading="lazy" width='100' height='60' >
        </a>
        <nav class="header-menu">
            <ul class="header-menu-list">
                <li class="header-menu-item">
                    <a class="header-menu-link" href="#Favorite coffee">Favorite coffee</a>
                </li>
                <li class="header-menu-item">
                    <a class="header-menu-link" href="#About">About</a>
                </li>
                <li class="header-menu-item">
                    <a class="header-menu-link" href="#Mobile app">Mobile app</a>
                </li>
                <li class="header-menu-item">
                    <a class="header-menu-link" href="#Contact us">Contact us</a>
                </li>
            </ul>
        </nav>
        <div class="header-actions">
            <button class="theme-toggle" id="themeToggle">
                <span class="theme-toggle-track">
                    <span class="theme-toggle-thumb"></span>
                    <img class="theme-toggle-icon sun-icon" src="./assets/icons/Sun.svg" alt="Light theme">
                    <img class="theme-toggle-icon moon-icon" src="./assets/icons/Moon.svg" alt="Dark theme">
                </span>
            </button>
            <a class="header-menu-link-cup" href="/">
            Menu <img src="./assets/icons/coffeecup.svg" class="cup-of-coffee"> 
            </a>
        </div>
    </header>
    <main></main>
    <footer></footer>
</body>
</html>
